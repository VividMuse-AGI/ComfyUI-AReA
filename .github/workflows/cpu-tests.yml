name: Static and CPU checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify repository files without loading models
        run: python tools/verify_release.py
      - name: Install CPU development dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.24' 'Pillow>=10' einops==0.8.1
      - name: Check out pinned ComfyUI source for CPU fixtures
        uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI
          ref: ba994879b88d0ebd9950b1e5c1e923d928f216ba
          path: .comfy-reference
          persist-credentials: false
      - name: Run all existing regressions on CPU
        env:
          AREA_COMFY_SOURCE: ${{ github.workspace }}/.comfy-reference
          CUDA_VISIBLE_DEVICES: ''
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee cpu-tests.log
      - name: Keep CPU test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-test-log
          path: cpu-tests.log
          if-no-files-found: ignore
